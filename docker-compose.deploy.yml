services:
  kiro2api:
    image: kiro2api:local
    container_name: kiro2api
    ports:
      - "127.0.0.1:8990:8990"
    volumes:
      - ./config:/app/config
    restart: unless-stopped

  caddy:
    image: caddy:2
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
