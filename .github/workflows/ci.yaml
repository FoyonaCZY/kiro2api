name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Build admin UI
        working-directory: admin-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: go build
        run: CGO_ENABLED=0 go build -o /tmp/kiro2api ./cmd/kiro2api

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 只验证 Deploy 用的 Dockerfile 能构建，不推送、不部署
      - name: Build image
        run: docker build -t kiro2api:ci .

      - name: Smoke test
        run: |
          mkdir -p /tmp/cfg
          echo '{"host":"0.0.0.0","port":8990,"apiKey":"sk-ci","adminApiKey":"adm-ci"}' > /tmp/cfg/config.json
          docker run -d --name k2 -p 18990:8990 -v /tmp/cfg:/app/config kiro2api:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18990/admin >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:18990/admin | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'x-api-key: adm-ci' http://127.0.0.1:18990/api/admin/credentials)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'x-api-key: wrong' http://127.0.0.1:18990/v1/models)" = 401
          docker logs k2
