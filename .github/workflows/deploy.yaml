name: Deploy

# 只能在 Actions 页面手动运行。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg VERSION=${GITHUB_SHA::7} -t kiro2api:local .

      - name: Save image
        run: docker save kiro2api:local | gzip > kiro2api.tar.gz

      - name: Upload image and compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          source: kiro2api.tar.gz,docker-compose.deploy.yml
          target: /opt/kiro-deploy
          overwrite: true

      - name: Load image and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          script: |
            set -euo pipefail
            if [ "$(id -u)" -eq 0 ]; then DOCKER=docker; else DOCKER="sudo docker"; fi
            DATA=/opt/kiro2api
            mkdir -p "$DATA/config"
            if [ ! -f "$DATA/config/config.json" ]; then
              echo "缺少 $DATA/config/config.json，先放好配置再部署" >&2
              exit 1
            fi
            gunzip -c /opt/kiro-deploy/kiro2api.tar.gz | $DOCKER load
            cp /opt/kiro-deploy/docker-compose.deploy.yml "$DATA/docker-compose.kiro2api.yml"
            if $DOCKER ps -q --filter name=^kiro-rs$ | grep -q .; then $DOCKER stop kiro-rs; fi
            cd "$DATA"
            $DOCKER compose -p kiro2api -f docker-compose.kiro2api.yml up -d --force-recreate
            $DOCKER ps --filter name=kiro2api
            rm -f /opt/kiro-deploy/kiro2api.tar.gz
